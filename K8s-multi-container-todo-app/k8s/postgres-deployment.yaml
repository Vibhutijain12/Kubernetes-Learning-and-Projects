kind: Deployment
apiVersion: apps/v1
metadata:
  name: postgres
  namespace: todo-app

spec:
  replicas: 1
  selector:
     matchLabels:
        app: postgres
  template:
    metadata:
      labels:
         app: postgres

    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432

          envFrom:
            - secretRef:
                name: todo-db-secret
          env:
            - name: POSTGRES_DB
              valueFrom:
                 configMapKeyRef:
                    name: todo-config
                    key: DB_NAME
          volumeMounts:
            - name: postgres-storage
              mountPath: /var/lib/postgresql/data
              subPath: postgres
      volumes:
        - name: postgres-storage
          persistentVolumeClaim:
             claimName: postgres-pvc
