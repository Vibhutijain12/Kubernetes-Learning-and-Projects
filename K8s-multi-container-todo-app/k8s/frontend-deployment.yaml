kind: Deployment
apiVersion: apps/v1
metadata:
  name: frontend
  namespace: todo-app
  labels:
    app: frontend

spec:
 replicas: 2
 selector:
   matchLabels:
     app: frontend
 template:
   metadata:
     labels:
        app: frontend

   spec:
     containers:
       - name: frontend
         image: vibhutijain12/todo-frontend:v1
         ports:
           - containerPort: 80

---

kind: Service
apiVersion: v1
metadata:
  name: frontend
  namespace: todo-app

spec:
 type: NodePort
 selector:
   app: frontend
 ports:
   - port: 80
     targetPort: 80
     nodePort: 30080
